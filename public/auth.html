<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Babutheni</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toast-box" id="toastBox"></div>

<nav>
  <div class="container nav-inner">
    <a class="logo" href="index.html" style="text-decoration:none">
      <div class="logo-icon">B</div>
      Babutheni
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="catalog.html" style="color:var(--text2);text-decoration:none;font-size:0.875rem;font-weight:500">Catalog</a></li>
      <li id="navDash" class="hid"><a href="dashboard.html" style="color:var(--text2);text-decoration:none;font-size:0.875rem;font-weight:500">Dashboard</a></li>
      <li id="navBuild" class="hid"><a href="builder.html" style="color:var(--text2);text-decoration:none;font-size:0.875rem;font-weight:500">Builder</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn btn-ghost hid" id="navOut" onclick="doLogout()">Sign out</button>
      <a class="btn btn-sec btn-sm hid" id="navIn" href="auth.html">Sign In</a>
      <a class="btn btn-prim btn-sm hid" id="navUp" href="auth.html?mode=signup">Get Started</a>
      <button class="mobile-btn" onclick="toggleMenu()">Menu</button>
    </div>
  </div>
</nav>

<section class="auth-page">
  <div class="auth-bg">
    <div class="hero-sunset"></div>
    <svg class="hero-waves" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path class="wave wave1" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,138.7C1248,139,1344,181,1392,202.7L1440,224L1440,320L0,320Z"></path>
      <path class="wave wave2" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,138.7C672,128,768,160,864,181.3C960,203,1056,213,1152,197.3C1248,181,1344,139,1392,117.3L1440,96L1440,320L0,320Z"></path>
      <path class="wave wave3" d="M0,288L60,272C120,256,240,224,360,224C480,224,600,256,720,266.7C840,277,960,267,1080,245.3C1200,224,1320,192,1380,176L1440,160L1440,320L0,320Z"></path>
    </svg>
    <canvas class="hero-particles" id="authParticles"></canvas>
  </div>

  <div class="auth-card fade">
    <div class="auth-head">
      <div class="auth-icon">B</div>
      <h2 id="authTitle">Welcome to Babutheni</h2>
      <p id="authSub">Sign in to manage your portfolio.</p>
    </div>
    <form id="authForm">
      <div class="form-group hid" id="gName">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="inName" placeholder="Ndlelehle Ntuli">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="inEmail" placeholder="you@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="inPass" placeholder="Enter your password" required>
      </div>
      <div class="err" id="authErr"></div>
      <button type="submit" class="btn btn-prim" style="width:100%" id="authBtn">Sign In</button>
    </form>
    <div class="auth-foot">
      <p id="authToggle">Don't have an account? <button type="button" onclick="toggleAuthMode()">Sign up</button></p>
    </div>
  </div>
</section>

<script src="common.js"></script>
<script>
let isSignup = false;

function applyMode() {
  document.getElementById('gName').classList.toggle('hid', !isSignup);
  document.getElementById('authBtn').textContent = isSignup ? 'Sign Up' : 'Sign In';
  document.getElementById('authTitle').textContent = isSignup ? 'Create your account' : 'Welcome to Babutheni';
  document.getElementById('authSub').textContent = isSignup ? 'Create your account to get started.' : 'Sign in to manage your portfolio.';
  document.getElementById('authToggle').innerHTML = isSignup
    ? 'Already have an account? <button type="button" onclick="toggleAuthMode()">Sign in</button>'
    : "Don't have an account? <button type=\"button\" onclick=\"toggleAuthMode()\">Sign up</button>";
  document.getElementById('authErr').classList.remove('show');
}

function toggleAuthMode() {
  isSignup = !isSignup;
  applyMode();
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('inEmail').value.trim();
  const pass = document.getElementById('inPass').value;
  const err = document.getElementById('authErr');
  err.classList.remove('show');
  const btn = document.getElementById('authBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Please wait...';

  try {
    if (isSignup) {
      const name = document.getElementById('inName').value.trim();
      if (!name) throw new Error('Please enter your name.');
      const data = await api('POST', '/api/auth/signup', { name, email, password: pass });
      sessionStorage.setItem('pendingEmail', data.email);
      window.location.href = 'verify.html';
    } else {
      await api('POST', '/api/auth/login', { email, password: pass });
      window.location.href = 'dashboard.html';
    }
  } catch (e2) {
    err.textContent = e2.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

// Particle field — confined to the auth page background only
(function(){
  const canvas = document.getElementById('authParticles');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const container = document.querySelector('.auth-page');
  let particles = [];

  function resize(){
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
  }

  function createParticles(){
    const count = Math.max(30, Math.floor((canvas.width * canvas.height) / 9000));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.4,
      speedY: Math.random() * 0.3 + 0.06,
      speedX: (Math.random() - 0.5) * 0.12,
      alpha: Math.random() * 0.6 + 0.2,
      twinkle: Math.random() * 0.015 + 0.004,
      dir: Math.random() > 0.5 ? 1 : -1
    }));
  }

  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y -= p.speedY;
      p.x += p.speedX;
      p.alpha += p.twinkle * p.dir;
      if (p.alpha <= 0.15 || p.alpha >= 0.85) p.dir *= -1;
      if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210,225,255,${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  createParticles();
  draw();
  window.addEventListener('resize', () => { resize(); createParticles(); });
})();

(async () => {
  // If already logged in, there's nothing to do here - go straight to the dashboard.
  const user = await getSession();
  if (user) { window.location.href = 'dashboard.html'; return; }

  const params = new URLSearchParams(window.location.search);
  isSignup = params.get('mode') === 'signup';
  applyMode();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Babutheni</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toast-box" id="toastBox"></div>

<nav>
  <div class="container nav-inner">
    <a class="logo" href="index.html" style="text-decoration:none">
      <div class="logo-icon">B</div>
      Babutheni
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="catalog.html" style="color:var(--text2);text-decoration:none;font-size:0.875rem;font-weight:500">Catalog</a></li>
      <li id="navDash" class="hid"><a href="dashboard.html" style="color:var(--text2);text-decoration:none;font-size:0.875rem;font-weight:500">Dashboard</a></li>
      <li id="navBuild" class="hid"><a href="builder.html" style="color:var(--text2);text-decoration:none;font-size:0.875rem;font-weight:500">Builder</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn btn-ghost hid" id="navOut" onclick="doLogout()">Sign out</button>
      <a class="btn btn-sec btn-sm hid" id="navIn" href="auth.html">Sign In</a>
      <a class="btn btn-prim btn-sm hid" id="navUp" href="auth.html?mode=signup">Get Started</a>
      <button class="mobile-btn" onclick="toggleMenu()">Menu</button>
    </div>
  </div>
</nav>

<main style="padding-top:64px">
  <div id="portContent"></div>
</main>

<script src="common.js"></script>
<script>
async function renderPort(id) {
  const container = document.getElementById('portContent');
  let user, profile;
  try {
    const data = await api('GET', '/api/portfolios/' + id);
    user = data.user;
    profile = data.profile;
  } catch (e) {
    container.innerHTML = '<div class="container" style="padding:8rem 2rem;text-align:center"><h1>Portfolio not found</h1></div>';
    return;
  }

  const me = await getSession();
  const isOwner = me && me.id === id;
  const skills = (profile.skills || []).map(s => '<span class="skill-tag">' + esc(s) + '</span>').join('');

  const projectsHtml = (profile.projects || []).map(p =>
    '<div class="proj-card"><div class="proj-img"></div><h4>' + esc(p.name) + '</h4><p>' + esc(p.description || '') + '</p>' +
    '<div style="padding:0 1.1rem"><div class="skills" style="margin-bottom:0.5rem">' +
    (p.tech || '').split(',').map(t => t.trim()).filter(Boolean).map(t => '<span class="skill-tag">' + esc(t) + '</span>').join('') + '</div></div>' +
    (p.link ? '<div class="proj-links"><a href="' + esc(p.link) + '" target="_blank" class="arr">View Demo</a></div>' : '') + '</div>'
  ).join('');

  const expHtml = (profile.experience || []).map(e =>
    '<div class="time-it"><h4>' + esc(e.role) + '</h4><div class="meta">' + esc(e.company) + ' &bull; ' + esc(e.start) + ' - ' + esc(e.end) + '</div><p>' + esc(e.description || '') + '</p></div>'
  ).join('');

  const eduHtml = (profile.education || []).map(ed =>
    '<div class="time-it"><h4>' + esc(ed.degree) + '</h4><div class="meta">' + esc(ed.institution) + ' &bull; ' + esc(ed.year) + '</div><p>' + esc(ed.description || '') + '</p></div>'
  ).join('');

  const ct = profile.contact || {};

  container.innerHTML =
    '<div class="port-hero"><div class="container">' +
    '<div class="port-hero-av">' + initials(user.name) + '</div>' +
    '<h1>' + esc(user.name) + '</h1>' +
    '<p class="sub">' + esc(profile.title || 'Professional') + '</p>' +
    '<p style="color:var(--text3);margin-bottom:1.5rem">' + esc(profile.location || 'Remote') + '</p>' +
    '<div class="skills" style="justify-content:center;margin-bottom:1.5rem">' + skills + '</div>' +
    '<div class="port-btns no-print">' +
    (isOwner ? '<a class="btn btn-sec" href="builder.html">Edit</a>' : '') +
    '<button class="btn btn-prim" id="dlCvBtn">Download CV</button>' +
    '<button class="btn btn-sec" id="copyLinkBtn">Copy Link</button>' +
    '<button class="btn btn-sec" id="scrollContactBtn">Get in Touch</button>' +
    '</div></div></div>' +
    '<div class="container" style="padding:4rem 1.5rem">' +
    (profile.bio ? '<div class="mb4"><h2 class="sec-tit">About</h2><p style="font-size:1.1rem;line-height:1.8;color:var(--text2)">' + esc(profile.bio) + '</p></div>' : '') +
    ((profile.projects || []).length ? '<div class="mb4"><h2 class="sec-tit">Projects</h2><div class="proj-grid">' + projectsHtml + '</div></div>' : '') +
    ((profile.experience || []).length ? '<div class="mb4"><h2 class="sec-tit">Experience</h2><div class="time">' + expHtml + '</div></div>' : '') +
    ((profile.education || []).length ? '<div class="mb4"><h2 class="sec-tit">Education & Certificates</h2><div class="time">' + eduHtml + '</div></div>' : '') +
    '</div>' +
    '<div id="contactSec" style="background:var(--bg2)"><div class="contact"><div class="txt-c mb4"><h2>Get in Touch</h2><p style="color:var(--text2)">Have a project in mind? Send a message directly.</p></div>' +
    '<div class="card"><div class="card-body"><h3 class="mb2">Let\'s work together</h3><p class="mb3" style="color:var(--text2)">Reach out with any questions, collaboration ideas, or opportunities.</p>' +
    '<form id="msgForm">' +
    '<div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="mName" placeholder="Your name" required></div>' +
    '<div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="mEmail" placeholder="you@email.com" required></div>' +
    '<div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" id="mBody" placeholder="Tell me about your project or idea..." required></textarea></div>' +
    '<button type="submit" class="btn btn-prim" style="width:100%">Send Message</button></form>' +
    (ct.linkedin || ct.github || ct.website
      ? '<div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;gap:1rem;justify-content:center">' +
        (ct.linkedin ? '<a href="' + esc(ct.linkedin) + '" target="_blank" class="btn btn-ghost">LinkedIn</a>' : '') +
        (ct.github ? '<a href="' + esc(ct.github) + '" target="_blank" class="btn btn-ghost">GitHub</a>' : '') +
        (ct.website ? '<a href="' + esc(ct.website) + '" target="_blank" class="btn btn-ghost">Website</a>' : '') +
        '</div>'
      : '') +
    '</div></div></div></div>';

  document.getElementById('dlCvBtn').addEventListener('click', () => dlCV(id));
  document.getElementById('copyLinkBtn').addEventListener('click', () => copyPortLink(id));
  document.getElementById('scrollContactBtn').addEventListener('click', () =>
    document.getElementById('contactSec').scrollIntoView({ behavior: 'smooth' }));
  document.getElementById('msgForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api('POST', '/api/portfolios/' + id + '/messages', {
        name: document.getElementById('mName').value,
        email: document.getElementById('mEmail').value,
        message: document.getElementById('mBody').value
      });
      toast('Message sent successfully!', 'ok');
      e.target.reset();
    } catch (e2) { toast(e2.message, 'no'); }
  });
}

(async () => {
  const user = await getSession();
  updateNav(user);

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('portContent').innerHTML = '<div class="container" style="padding:8rem 2rem;text-align:center"><h1>No portfolio specified</h1></div>';
    return;
  }
  renderPort(id);
})();
</script>
</body>
</html>
